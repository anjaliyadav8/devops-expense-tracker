version: '3.8'

services:

  frontend:
    build: ./frontend
    container_name: expense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - expense-network

  backend:
    build: ./backend
    container_name: expense-backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - expense-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  expense-network:
    driver: bridge
